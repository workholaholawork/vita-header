<!-- 3. MOBILE: внутри .mobile_header_top сохранить штатные burger и logo-block,

      data-event="jqm" data-param-id="19" data-name="record_online"
      role="button" tabindex="0">Запись</span>

<!-- 4. BURGER SEARCH: разместить первым элементом внутри #mobilemenu .wrap,
     перед .menu.top. В production вместо копирования HTML повторно вывести тот же
     компонент bitrix:search.title, который используется на desktop, но передать
     INPUT_ID=title-search-input_mobile и CONTAINER_ID=title-search_mobile. -->
<div class="mobile-menu-search" id="title-search_mobile">
  <form action="/search/" class="mobile-menu-search__form" role="search">
    <label class="mobile-menu-search__label" for="title-search-input_mobile">Поиск по сайту</label>
    <input class="mobile-menu-search__input" id="title-search-input_mobile" type="text"
           name="q" value="" placeholder="Поиск по сайту" maxlength="50" autocomplete="off">
    <button class="mobile-menu-search__button" type="submit" name="s"
            value="Поиск по сайту" aria-label="Найти">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>
    </button>
  </form>
</div>
